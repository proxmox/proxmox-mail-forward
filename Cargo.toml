[workspace]
members = [
    "common",
    "proxmox-mail-forward",
    "pve-notify-worker",
]
resolver = "3"

[workspace.package]
version = "1.2.0"
authors = [
    "Fiona Ebner <f.ebner@proxmox.com>",
    "Lukas Wagner <l.wagner@proxmox.com>",
    "Proxmox Support Team <support@proxmox.com>",
]
edition = "2024"
license = "AGPL-3"
homepage = "https://www.proxmox.com"

[workspace.dependencies]
anyhow = "1.0"
futures = "0.3"
nix = "0.29"
tokio = "1.6"
tracing = "0.1"

proxmox-async = "0.5"
proxmox-daemon = "1"
proxmox-log = "1"
proxmox-notify = "3"
proxmox-sys = "1"

common = { path = "common" }
