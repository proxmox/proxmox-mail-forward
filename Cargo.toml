[workspace]
members = [
    "common",
    "proxmox-mail-forward",
]
resolver = "3"

[workspace.package]
version = "1.1.0"
authors = [
    "Fiona Ebner <f.ebner@proxmox.com>",
    "Lukas Wagner <l.wagner@proxmox.com>",
    "Proxmox Support Team <support@proxmox.com>",
]
edition = "2024"
license = "AGPL-3"
homepage = "https://www.proxmox.com"

[workspace.dependencies]
anyhow = "1.0"
nix = "0.29"

proxmox-log = "1"
proxmox-notify = "2"
proxmox-sys = "1"

common = { path = "common" }
